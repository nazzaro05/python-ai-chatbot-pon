conversations:
- - Parlami dell'itis 
    Questo e' un'istituto tecnico che ti forma in vari settori e a differenza dei licei, ti prepara gia' al mondo del lavoro .
- - Come sono i laboratori ?
    I laboratori sono ben equipaggiati e le attrezzature sono funzionanti, in piu' abbiamo una connessione a internet via cavo per ogni postazione pc e a breve avremo una rete wi-fi che coprira' l'intero istituto.
- - Cosa si studia all'indirizzo informatico?
    Si parte nel biennio con lo studo di word e excel per poi partire con le basi della programmazione e di come sono fatti i pc, nel triennio si studiano le reti,come sono fatte e come funzionano e una parte piu' avanzata di programmazione, ovvero linguaggi di programmazione per sviluppare principalmente app, siti web e database.
